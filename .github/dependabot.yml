# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    # 0 disables scheduled version-update PRs. Security updates are exempt from
    # this limit, so advisories still get through -- this only stops routine
    # version bumps, which nobody asked for.
    open-pull-requests-limit: 0
    groups:
      # Security advisories open one PR each by default, and ignore
      # open-pull-requests-limit. Grouping collapses them into a single PR that
      # Dependabot amends as new advisories land. `applies-to` is required --
      # groups cover version updates only otherwise.
      security:
        applies-to: security-updates
        patterns:
          - '*'
